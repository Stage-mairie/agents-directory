<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion - Annuaire</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-container">
        <div class="header-left">
          <img src="images/logo.png" alt="Logo de la mairie" class="logo" />
        </div>
        <div class="header-center">
          <h1 class="header-title">Annuaire des Agents de la Mairie de Saint-André</h1>
        </div>
      </div>
    </header>

    <section id="login-section">
      <form id="login-form">
        <h2>Connexion</h2>
        <input type="text" id="login-username" placeholder="Nom d'utilisateur" required />
        <input type="password" id="login-password" placeholder="Mot de passe" required />
        <button type="submit">Se connecter</button>
        <p id="login-error"></p>
      </form>
    </section>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
<footer>
  <p>&copy; 2025 Mairie de Saint-André. Tous droits réservés.</p>
</footer>
</html>
