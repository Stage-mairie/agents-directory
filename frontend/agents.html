<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Annuaire des Agents</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-container">
    <header>
      <div class="header-container">
        <div class="header-left">
          <img src="images/logo.png" alt="Logo de la mairie" class="logo" />
        </div>
        <div class="header-center">
          <h1 class="header-title">Annuaire des Agents de la Mairie de Saint-André</h1>
        </div>
      </div>
    </header>

    <div id="main-container">
      <div class="search-section">
        <div class="search-container">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
          </svg>
          <input type="text" class="search-bar" placeholder="Rechercher un agent" />
        </div>
      </div>

      <div class="filters-container">
        <button id="sort-alpha-btn">Trier A-Z</button>
        <div class="service-filter">
          <label for="service">Trier par service :</label>
          <select id="service">
            <option value="all">Tous les services</option>
            <option value="administration">Administration</option>
            <option value="informatique">Informatique</option>
            <option value="technique">Technique</option>
            <option value="education">Éducation</option>
          </select>
        </div>
        <button id="add-agent-btn" type="button">Ajouter un agent</button>
        <button id="logout-btn">Déconnexion</button>
      </div>

      <form id="add-agent-form" class="simple-form" style="display: none;">
        <label>Nom
          <input name="nom" placeholder="Ex: DUPONT" required />
        </label>

        <label>Prénom(s)
          <input name="prenom" placeholder="Ex: Alice" required />
        </label>

        <label>Portable
          <input name="portable" placeholder="Ex: 0601020304" pattern="\d{10}" maxlength="10" />
        </label>

        <label>Fixe
          <input name="fixe" placeholder="Ex: 0140203040" pattern="\d{10}" maxlength="10" />
        </label>

        <label>Numéro de Poste
          <input name="numeroPoste" placeholder="Ex: 1234" pattern="\d{4}" maxlength="4" />
        </label>

        <label>Poste
          <input name="poste" placeholder="Ex: Chargé de mission" />
        </label>

        <label>Email
          <input name="email" type="email" placeholder="Ex: alice.dupont@mairie.fr" required />
        </label>

        <label>Service</label>
        <select id="service-level-1" required></select>
        <select id="service-level-2"></select>
        <select id="service-level-3"></select>

        <div class="button-row">
          <button type="submit" id="save-agent-btn">Enregistrer</button>
          <button type="button" id="cancel-add-btn" class="cancel-btn">Annuler</button>
        </div>
      </form>

      <section class="agent-list"></section>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/editForm.js"></script>
</body>
<footer>
  <p>&copy; 2025 Mairie de Saint-André. Tous droits réservés.</p>
</footer>
</html>
